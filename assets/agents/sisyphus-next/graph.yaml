name: sisyphus-next
description: |
  CANDIDATE decomposition of the sisyphus orchestrator into a session graph.
  The protocol the prose sisyphus enforces becomes edges: script nodes
  own routing, bounds, ledgers and sentinel parsing; short single-question llm nodes
  own the judgment; coder / review-gauntlet / explore / librarian / oracle /
  step-runner / whetstone / engineer run as agent-node islands exactly as they ship.
  Candidate status: no agent lists this as spawnable, the shipped sisyphus is
  untouched, and this directory is replaced by the facade at cutover (D1) once the
  A9 artifact-equivalence replay passes. The run-or-chat session surface is the
  facade's: work routes to the graph, conversation to the engineer chat lane.
version: '1.0'

# Dynamic spawning from llm nodes (research_answer, send_breach_notice, the inbox
# checks, observability_pass) plus the agent-node islands. Limits mirror
# sisyphus/config.yaml.
can_spawn_agents: true
max_concurrent_agents: 40
max_agent_depth: 5

global_tools:
  - ast_grep.sh
  - fs_read.sh
  - fs_grep.sh
  - fs_glob.sh
  - fs_ls.sh
  - fs_write.sh
  - fs_patch.sh
  - execute_command.sh
  - web_search_coyote.sh

skills_enabled: true
enabled_skills:
  - code-review
  - diagnosing-bugs
  - observability-review
  - git-master
  - delegation-protocol
  - parallel-research
  - verification-gates
  - oracle-protocol

variables:
  # Mirror of sisyphus's variables: names AND defaults identical, so an
  # explicit spawn override and an unset variable both behave as they do today.
  - name: project_dir
    description: Project directory to work in
    default: '.'
  - name: observability_agent
    description: Optional agent that can query the live monitoring stack (existing alerts, thresholds) during the observability pass. Empty disables the live lookup; repo-derived inventory still runs.
    default: ''
  - name: parallel
    description: "Set to '1' when this Sisyphus is one task agent in a parallel batch (isolated worktree, own task branch, teammate roster from the parent). Gates the parallel-batch teamwork protocol into the graph; leave '0' for a standalone or sequential run."
    default: '0'
  - name: auto_confirm
    description: Auto-confirm command execution
    default: '1'
  - name: escalation_policy
    description: "How escalation-worthy decisions are handled mid-run: 'interactive' pauses and asks the user; 'autonomous' self-resolves decisions covered by a standing ruling or a clearly recommended option, reports them in a final-report digest, and only pings on hard triggers or novel conflicts"
    default: 'interactive'
  - name: build_lock
    description: "Command prefix for every declared verification command, e.g. `flock -w 240 /path/to/lock`; empty runs them bare. It is substituted raw into a JSON string on every hop, so it must be free of double quotes and backslashes; quote paths with single quotes (`flock '/tmp/my lock'`)"
    default: ''
  - name: review_cadence
    description: "When the post-coder review passes run: 'task' (default: this Sisyphus runs the review gauntlet on its own work) or 'batch' (set by a parent orchestrator running micro-granularity tasks: coder verification only; the orchestrator runs the full review panel once over the whole batch). Never set 'batch' for a standalone run."
    default: 'task'

settings:
  # Engine backstop only: every cycle carries its own named bound in a script. Worst legitimate visit count of the most-visited node
  # (run_gauntlet: 1 + 3 fix rounds + 1 debris re-run + 1 observability round = 6
  # per subtask, x3 subtasks = 18); user-driven review retries ride the headroom.
  max_loop_iterations: 100
  log_state_snapshots: true
  validate_before_run: true
  # Orchestration runs are long by design (the facade's choice); the islands that
  # run to completion carry their own graph timeouts (coder 14400, gauntlet 69600).
  timeout: 0

session:
  expose:
    - run_id
    - run_dir
    - intent
    - sizing
    - base_sha
    - head_sha
    - gauntlet_verdict
    - report
  route:
    instructions: |
      Route RUN when the message asks for WORK to be executed: implement, fix,
      refactor, or build something; execute a task, plan, or handoff ("execute
      the handoff at <path>"); resume, continue, or retry a task; run
      verification, reviews, or the gauntlet. Route CHAT for everything
      conversational: questions ("how does X work", "where is Y"), status and
      run-record questions, debugging discussions, design or research requests,
      brainstorming, and anything about UNDERSTANDING rather than doing - the
      chat lane is the engineer, a read-only staff-engineer companion with its
      own explore/librarian/oracle research fan-out that writes handoffs and
      amendment artifacts instead of code. When uncertain or the message mixes
      both, route CHAT: the engineer can always end with a handoff the user
      explicitly runs, but a wrongly-routed RUN performs writes nobody asked for.
  chat:
    agent: engineer
    variables:
      chat_agent_for: sisyphus

