name: architect
description: |
  Design-doc orchestrator for any project. Consumes a high-level design doc, decomposes it into a
  gated plan (gatekeeper self-containedness + oracle plan-review) and ~1-engineer-day task files,
  spawns one Sisyphus per task on a single run branch, verifies each with an adversarial
  plan-conformance check (plus a black-box usage-pattern probe for consumer-facing surface), and
  finishes with ONE draft PR (CI checks watched to green) plus tracked follow-up tasks — or, with
  pr_strategy=multi, one stacked draft PR per plan-declared PR group. Task state lives on disk in a
  plans directory, so runs survive context compression.
version: 2.13.0
agent_session: temp
auto_continue: true
max_auto_continues: 100
inject_todo_instructions: true

dynamic_instructions: true

can_spawn_agents: true
spawnable_agents:
  - sisyphus
  - oracle
  - explore
  - librarian
  - deep-research
  - adversary
  - probe
  - review-gauntlet
  - gatekeeper
  - whetstone
max_concurrent_agents: 10
max_agent_depth: 10
inject_spawn_instructions: true
summarization_threshold: 100000

skills_enabled: true
enabled_skills:
  - design-session
  - grilling
  - task-tracking
  - plan-authoring
  - delegation-protocol
  - git-master
  - parallel-research

variables:
  - name: project_dir
    description: Absolute path to the target project repo — the ONLY write target for feature code
    default: '.'
  - name: plans_dir
    description: Where the PLAN file and task dirs live. Relative paths resolve against project_dir (and then ride the run branch into the PR); an absolute path outside the repo keeps planning files out of git entirely.
    default: 'plans'
  - name: design_doc
    description: Path to the high-level design doc to implement (absolute, or relative to project_dir)
    default: ''
  - name: base_branch
    description: The branch the run branch forks from and the PR targets
    default: 'main'
  - name: autonomy
    description: 'How autonomous the run is: full (no gates), plan-gate (approve breakdown once, then autonomous), phase-gate (approve each task)'
    default: full
  - name: escalation_policy
    description: "How escalation-worthy decisions (yours and relayed child escalations) are handled: 'interactive' pauses and asks the user; 'autonomous' self-resolves decisions covered by a standing ruling or a clearly recommended option, reports them in the Phase F digest, and only pings on hard triggers or novel conflicts"
    default: 'interactive'
  - name: auto_confirm
    description: Auto-confirm command execution (1 = skip the shell guard_operation TTY prompt, needed for non-interactive autonomous runs)
    default: '1'
  - name: parallel_tasks
    description: 'Opt-in worktree-based parallel task execution: 0 = sequential (default, one task at a time on the run branch), 1 = eligible tasks run as concurrent Sisyphus agents in isolated git worktrees, merged back one at a time'
    default: '0'
  - name: pr_strategy
    description: "PR packaging: 'single' = the whole design doc lands as ONE draft PR opened in Phase F (default); 'multi' = the plan partitions tasks into PR groups, each landing as its own stacked draft PR opened at group close-out — for larger plans where one PR would be unreviewable"
    default: 'single'
  - name: build_lock
    description: "Command prefix forwarded to every Sisyphus spawn and on to its coder/step-runner build/test/lint gates and to the review-gauntlet/adversary verification runs, e.g. `flock -w 240 /path/to/lock`; empty runs gates bare. It is substituted raw into a JSON string on every hop, so it must be free of double quotes and backslashes; quote paths with single quotes (`flock '/tmp/my lock'`)"
    default: ''
  - name: task_granularity
    description: "Task sizing for the plan: 'standard' (default, ~1 engineer-day tasks - today's behavior, unchanged) or 'micro' (tasks sized to one file/seam with exact signatures and EXECUTABLE acceptance criteria, grouped into plan-section batches; per task only coder verify + the adversary criteria check run, the full review gauntlet runs once per batch; designed for small/local implementer models and for runs where per-task blast radius must be minimal)"
    default: 'standard'

global_tools:
  - ast_grep.sh
  - fs_read.sh
  - fs_grep.sh
  - fs_glob.sh
  - fs_ls.sh
  - fs_write.sh
  - fs_patch.sh
  - fs_mkdir.sh
  - execute_command.sh

instructions: |
  Instructions are rendered dynamically: the `_instructions` tool (tools.sh) assembles them from
  instructions.md, resolving `<!-- when:... -->` conditional blocks against the agent variables
  (autonomy, escalation_policy, parallel_tasks, pr_strategy). This static text is a placeholder
  shown only when the dynamic render is unavailable (e.g. `--info`); it is never the live prompt.

conversation_starters:
  - 'Implement the design doc at {{design_doc}} end to end'
  - 'Decompose this design doc into a plan and tasks, then drive them to completion'
  - 'Run the full design-to-PR pipeline on {{design_doc}}'
