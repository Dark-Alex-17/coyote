name: sisyphus
description: OpenCode-style orchestrator - classifies intent, delegates to specialists, tracks progress with todos, enforces OMO-grade verification discipline
version: 3.24.0

agent_session: temp
auto_continue: true
max_auto_continues: 25
inject_todo_instructions: true

dynamic_instructions: true

can_spawn_agents: true
spawnable_agents:
  - explore
  - librarian
  - deep-research
  - coder
  - oracle
  - code-reviewer
  - adversary
  - security-reviewer
  - probe
  - review-gauntlet
  - architecture-reviewer
  - step-runner
  - whetstone
max_concurrent_agents: 40
max_agent_depth: 5
inject_spawn_instructions: true
summarization_threshold: 80000

skills_enabled: true
enabled_skills:
  - ai-slop-remover
  - code-review
  - comment-discipline
  - diagnosing-bugs
  - grilling
  - logging-discipline
  - observability-review
  - git-master
  - frontend-ui-ux
  - delegation-protocol
  - parallel-research
  - verification-gates
  - oracle-protocol
  - plan-authoring
  - step-implementation
  - handoff-protocol
  - iwe-knowledge-base

variables:
  - name: project_dir
    description: Project directory to work in
    default: '.'
  - name: observability_agent
    description: Optional agent that can query the live monitoring stack (existing alerts, thresholds) during the observability pass. Empty disables the live lookup; repo-derived inventory still runs.
    default: ''
  - name: parallel
    description: "Set to '1' when this Sisyphus is one task agent in a parallel batch (isolated worktree, own task branch, teammate roster from the parent). Gates the parallel-batch teamwork protocol into the instructions; leave '0' for a standalone or sequential run."
    default: '0'
  - name: auto_confirm
    description: Auto-confirm command execution
    default: '1'
  - name: escalation_policy
    description: "How escalation-worthy decisions are handled mid-run: 'interactive' pauses and asks the user; 'autonomous' self-resolves decisions covered by a standing ruling or a clearly recommended option, reports them in a final-report digest, and only pings on hard triggers or novel conflicts"
    default: 'interactive'
  - name: build_lock
    description: "Command prefix forwarded to every coder/step-runner spawn for their build/test/lint gates and to the review-gauntlet/adversary verification runs, e.g. `flock -w 240 /path/to/lock`; empty runs gates bare. It is substituted raw into a JSON string on every hop, so it must be free of double quotes and backslashes; quote paths with single quotes (`flock '/tmp/my lock'`)"
    default: ''
  - name: review_cadence
    description: "When the post-coder review passes run: 'task' (default - this Sisyphus runs the review gauntlet / independent reviewers on its own work, today's behavior) or 'batch' (set by a parent orchestrator running micro-granularity tasks: this Sisyphus runs coder verification only - build + tests green, debt/decision bookkeeping - and the orchestrator runs the full review panel once over the whole batch of micro-tasks). Never set 'batch' for a standalone run."
    default: 'task'

mcp_servers:
  - ddg-search
global_tools:
  - ast_grep.sh
  - fs_read.sh
  - fs_cat.sh
  - fs_grep.sh
  - fs_glob.sh
  - fs_ls.sh
  - fs_write.sh
  - fs_patch.sh
  - execute_command.sh
  - web_search_coyote.sh

instructions: |
  Instructions are rendered dynamically: the `_instructions` tool (tools.sh) assembles them from
  instructions.md, resolving `<!-- when:... -->` conditional blocks against the agent variables
  (parallel, observability_agent, escalation_policy, review_cadence). This static text is a
  placeholder shown only when the dynamic render is unavailable (e.g. `--info`); it is never the
  live prompt.

conversation_starters:
  - 'Add a new feature to the project'
  - 'Fix a bug in the codebase'
  - 'Refactor the authentication module'
  - 'Help me understand how X works'
