name: architect-next
description: |
  CANDIDATE decomposition of the architect orchestrator into a session graph.
  The protocol the prose architect enforces becomes edges: script nodes
  own the mode routing (pr_strategy x parallel_tasks x task_granularity x autonomy x
  escalation_policy), the task scheduler, every bound, the ledgers and sentinel
  parsing; short single-question llm nodes own the judgment (orient, author/amend the
  plan, answer leaks, integrate findings, task-done edits, batch triage, CI diagnosis);
  gatekeeper / oracle / explore / librarian / review-gauntlet / adversary /
  whetstone / engineer and the sisyphus delegate run as agent-node islands exactly
  as they ship. Candidate status: no agent lists this as spawnable, the facade
  agents/architect is untouched, and this directory is replaced by the facade at
  cutover once the artifact-equivalence replay passes. The run-or-chat session
  surface is the facade's: work routes to the graph, conversation to the engineer.
version: '1.0'

# Dynamic spawning from llm nodes (answer_leaks fans out explore/librarian)
# plus the agent-node islands. Limits mirror architect/config.yaml.
can_spawn_agents: true
max_concurrent_agents: 10
max_agent_depth: 10

global_tools:
  - ast_grep.sh
  - fs_read.sh
  - fs_grep.sh
  - fs_glob.sh
  - fs_ls.sh
  - fs_write.sh
  - fs_patch.sh
  - execute_command.sh
  - web_search_coyote.sh

skills_enabled: true
enabled_skills:
  - design-session
  - grilling
  - task-tracking
  - plan-authoring
  - delegation-protocol
  - git-master
  - parallel-research

variables:
  # Mirror of architect's variables: names AND defaults identical, so an
  # explicit spawn override and an unset variable both behave as they do today.
  - name: project_dir
    description: Absolute path to the target project repo - the ONLY write target for feature code
    default: '.'
  - name: plans_dir
    description: Where the PLAN file and task dirs live. Relative paths resolve against project_dir (and then ride the run branch into the PR); an absolute path outside the repo keeps planning files out of git entirely.
    default: 'plans'
  - name: design_doc
    description: Path to the high-level design doc to implement (absolute, or relative to project_dir)
    default: ''
  - name: base_branch
    description: The branch the run branch forks from and the PR targets
    default: 'main'
  - name: autonomy
    description: 'How autonomous the run is: full (no gates), plan-gate (approve breakdown once, then autonomous), phase-gate (approve each task)'
    default: full
  - name: escalation_policy
    description: "How escalation-worthy decisions (yours and relayed child escalations) are handled: 'interactive' pauses and asks the user; 'autonomous' self-resolves decisions covered by a standing ruling or a clearly recommended option, reports them in the Phase F digest, and only pings on hard triggers or novel conflicts"
    default: 'interactive'
  - name: auto_confirm
    description: Auto-confirm command execution (1 = skip the shell guard_operation TTY prompt, needed for non-interactive autonomous runs)
    default: '1'
  - name: parallel_tasks
    description: 'Opt-in worktree-based parallel task execution: 0 = sequential (default, one task at a time on the run branch), 1 = eligible tasks run as concurrent Sisyphus agents in isolated git worktrees, merged back one at a time'
    default: '0'
  - name: pr_strategy
    description: "PR packaging: 'single' = the whole design doc lands as ONE draft PR opened in Phase F (default); 'multi' = the plan partitions tasks into PR groups, each landing as its own stacked draft PR opened at group close-out - for larger plans where one PR would be unreviewable"
    default: 'single'
  - name: build_lock
    description: "Command prefix forwarded to every Sisyphus spawn and on to its coder/step-runner build/test/lint gates and to the review-gauntlet/adversary verification runs, e.g. `flock -w 240 /path/to/lock`; empty runs gates bare. It is substituted raw into a JSON string on every hop, so it must be free of double quotes and backslashes; quote paths with single quotes (`flock '/tmp/my lock'`)"
    default: ''
  - name: task_granularity
    description: "Task sizing for the plan: 'standard' (default, ~1 engineer-day tasks - today's behavior, unchanged) or 'micro' (tasks sized to one file/seam with exact signatures and EXECUTABLE acceptance criteria, grouped into plan-section batches; per task only coder verify + the adversary criteria check run, the full review gauntlet runs once per batch; designed for small/local implementer models and for runs where per-task blast radius must be minimal)"
    default: 'standard'

settings:
  # Engine backstop only: every cycle carries its own named bound in a script. It counts visits per node per RUN, so for an
  # orchestration it is a defect detector, not a budget. ci_poll alone may revisit itself CI_MAX_ROUNDS (240) times per PR
  # before it routes ci_status=timeout; 1000 covers four group PRs each watched to that wall cap and stays finite.
  max_loop_iterations: 1000
  log_state_snapshots: true
  validate_before_run: true
  # Architect runs span hours-to-days (the facade's choice); the delegate and the
  # gauntlet islands run to completion under their own budgets.
  timeout: 0

session:
  expose:
    - run_id
    - run_dir
    - plan_path
    - plan_slug
    - sealed
    - gate2_verdict
    - run_branch
    - pr_url
    - ci_status
    - report
  route:
    instructions: |
      Route RUN when the message asks for WORK to be executed: run a plan or
      design doc end-to-end, materialize or execute tasks, resume or continue a
      run, execute fix rounds, open/finish the run's PR flow, or "execute the
      handoff at <path>". Route CHAT for everything conversational: questions
      about the codebase or the run ("how does X work", "what's the status of
      task 3", "why did the gauntlet block"), design and research discussions,
      plan brainstorming, and anything about UNDERSTANDING rather than doing -
      the chat lane is the engineer, a read-only staff-engineer companion with
      its own explore/librarian/oracle research fan-out; it writes design-doc
      seeds, handoffs, and amendment artifacts (plans/amendments/) instead of
      executing, and plan-shaped changes it records flow through the run's amend
      path rather than bypassing the gatekeeper. When uncertain or the message
      mixes both, route CHAT: the engineer can always conclude with an artifact
      the user explicitly runs, but a wrongly-routed RUN performs writes nobody
      asked for.
  chat:
    agent: engineer
    variables:
      chat_agent_for: architect

