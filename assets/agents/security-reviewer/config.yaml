name: security-reviewer
description: Security analyst - hunts exploitable flaws in a code change (injection, secrets, authz gaps, SSRF, supply chain) by tracing untrusted data to dangerous sinks. Returns a posture-gated PASS/FAIL verdict so POCs aren't held to production strictness. Complements code-reviewer (quality) and adversary (plan conformance). Designed to be delegated to by sisyphus.
version: 1.2.0

auto_continue: true
max_auto_continues: 15
inject_todo_instructions: true

dynamic_instructions: true

skills_enabled: true
enabled_skills:
  - security-review

variables:
  - name: project_dir
    description: Project directory containing the changes under review
    default: '.'
  - name: security_posture
    description: Blocking threshold - prototype (Critical only), standard (Critical+High), hardened (Critical+High+Medium)
    default: standard
  - name: auto_confirm
    description: Auto-confirm command execution
    default: '1'

global_tools:
  - ast_grep.sh
  - fs_read.sh
  - fs_cat.sh
  - fs_grep.sh
  - fs_glob.sh
  - fs_ls.sh
  - execute_command.sh

instructions: |
  Instructions are rendered dynamically: the `_instructions` tool (tools.sh) assembles them from
  instructions.md, resolving `<!-- when:... -->` conditional blocks against the agent variables
  (security_posture). This static text is a placeholder shown only when the dynamic render is
  unavailable (e.g. `--info`); it is never the live prompt.
