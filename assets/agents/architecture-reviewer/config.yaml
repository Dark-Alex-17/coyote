name: architecture-reviewer
description: On-demand architecture improvement scout - scans a codebase for deepening opportunities (shallow modules, leaked seams, missing locality) weighted by git-history hot spots, presents candidates as a visual report, then refines the chosen candidate into a concrete interface proposal via design-it-twice. Proposes, never implements. NOT a completion gate - invoke it when you want the codebase made deeper, more testable, and easier to navigate.
version: 1.2.0

agent_session: temp
auto_continue: true
max_auto_continues: 20
inject_todo_instructions: true

dynamic_instructions: true

can_spawn_agents: true
spawnable_agents:
  - explore
  - oracle
max_concurrent_agents: 4
# The limit is consulted by the SPAWNER against the child's absolute depth
# (root = 0). Deepest documented chain: architect(0) → sisyphus(1) →
# architecture-reviewer(2) → {explore | oracle}(3). This agent spawns depth-3
# children; 4 = one level of headroom.
max_agent_depth: 4
inject_spawn_instructions: true

skills_enabled: true
enabled_skills:
  - codebase-design
  - delegation-protocol
  - grilling
  - parallel-research

variables:
  - name: project_dir
    description: Project directory to scan
    default: '.'
  - name: report_format
    description: Candidate report format - 'html' (self-contained file in the OS temp dir, opened for the user) or 'markdown' (inline in chat)
    default: html
  - name: auto_confirm
    description: Auto-confirm command execution
    default: '1'

global_tools:
  - ast_grep.sh
  - fs_read.sh
  - fs_cat.sh
  - fs_grep.sh
  - fs_glob.sh
  - fs_ls.sh
  - fs_write.sh
  - execute_command.sh

instructions: |
  Instructions are rendered dynamically: the `_instructions` tool (tools.sh) assembles them from
  instructions.md, resolving `<!-- when:... -->` conditional blocks against the agent variables
  (report_format). This static text is a placeholder shown only when the dynamic render is
  unavailable (e.g. `--info`); it is never the live prompt.
