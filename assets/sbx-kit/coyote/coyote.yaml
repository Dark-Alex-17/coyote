          - domain: api.cloudflare.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    description: DeepInfra API key, injected on api.deepinfra.com
    config:
      service: deepinfra
      phase: runtime
      apiKey:
        name: DEEPINFRA_API_KEY
        proxyManaged: true
        inject:
          - domain: api.deepinfra.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    description: DeepSeek API key, injected on api.deepseek.com
    config:
      service: deepseek
      phase: runtime
      apiKey:
        name: DEEPSEEK_API_KEY
        proxyManaged: true
        inject:
          - domain: api.deepseek.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Mistral API key, injected on api.mistral.ai
    config:
      service: mistral
      phase: runtime
      apiKey:
        name: MISTRAL_API_KEY
        proxyManaged: true
        inject:
          - domain: api.mistral.ai
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Perplexity API key, injected on api.perplexity.ai
    config:
      service: perplexity
      phase: runtime
      apiKey:
        name: PERPLEXITY_API_KEY
        proxyManaged: true
        inject:
          - domain: api.perplexity.ai
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Voyage AI API key, injected on api.voyageai.com
    config:
      service: voyageai
      phase: runtime
      apiKey:
        name: VOYAGE_API_KEY
        proxyManaged: true
        inject:
          - domain: api.voyageai.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    description: xAI (Grok) API key, injected on api.x.ai
    config:
      service: xai
      phase: runtime
      apiKey:
        name: XAI_API_KEY
        proxyManaged: true
