            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Jina API key, injected on api.jina.ai and r.jina.ai
    config:
      service: jina
      phase: runtime
      apiKey:
        name: JINA_API_KEY
        proxyManaged: true
        inject:
          - domain: api.jina.ai
            header: Authorization
            format: "Bearer %s"
          - domain: r.jina.ai
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Baidu ERNIE API key, injected on qianfan.baidubce.com
    config:
      service: ernie
      phase: runtime
      apiKey:
        name: ERNIE_API_KEY
        proxyManaged: true
        inject:
          - domain: qianfan.baidubce.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Tencent Hunyuan API key, injected on api.hunyuan.cloud.tencent.com
    config:
      service: hunyuan
      phase: runtime
      apiKey:
        name: HUNYUAN_API_KEY
        proxyManaged: true
        inject:
          - domain: api.hunyuan.cloud.tencent.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    description: MiniMax API key, injected on api.minimax.chat
    config:
      service: minimax
      phase: runtime
      apiKey:
        name: MINIMAX_API_KEY
        proxyManaged: true
