# Hand-owned model behavior overlay.
#
# Everything in this file is curated by hand and layered on top of API-sourced
# model data: oauth blocks, request patches, wire-name aliases, behavioral
# flags, and models that no public catalog provides.
#
# `models:` entries are self-complete — `rules` apply ONLY to API-sourced
# models, never to hand-owned `models:` entries. Legacy verbatim-preserved
# entries are grouped under a `# legacy — pruning candidates` comment.

