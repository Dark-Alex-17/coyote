[package]
name = "coyote-ai"
version = "0.10.3"
edition = "2024"
authors = ["Alex Clarke <alex.j.tusa@gmail.com>"]
description = "The batteries-included runtime for LLMs"
keywords = ["chatgpt", "llm", "cli", "ai", "repl"]
homepage = "https://github.com/Dark-Alex-17/coyote"
repository = "https://github.com/Dark-Alex-17/coyote"
categories = ["command-line-utilities"]
readme = "README.md"
license = "AGPL-3.0-only"
rust-version = "1.95.0"
exclude = [".github", "CONTRIBUTING.md"]

[dependencies]
anyhow = "1.0.69"
bytes = "1.4.0"
clap = { version = "4.5.40", features = ["cargo", "derive", "wrap_help"] }
comfy-table = { version = "7.1.4", features = ["custom_styling"] }
dirs = "6.0.0"
duckdb = { version = "1.10505.0", features = ["bundled"] }
dunce = "1.0.5"
futures-util = "0.3.29"
inquire = "0.9.4"
is-terminal = "0.4.9"
reedline = "0.47.0"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = { version = "1.0.93", features = ["preserve_order"] }
serde_yaml = "0.9.17"
tokio = { version = "1.34.0", features = [
  "rt",
  "time",
  "macros",
  "signal",
  "rt-multi-thread",
  "full",
] }
crossterm = "0.29.0"
chrono = "0.4.23"
bincode = { version = "2.0.0", features = [
  "serde",
  "std",
], default-features = false }
parking_lot = "0.12.1"
fancy-regex = "0.14.0"
base64 = "0.22.0"
nu-ansi-term = "0.50.0"
async-trait = "0.1.74"
textwrap = "0.16.0"
ansi_colours = "1.2.2"
eventsource-stream = "0.2.3"
log = "0.4.28"
log4rs = { version = "1.4.0", features = [
  "file_appender",
  "rolling_file_appender",
  "compound_policy",
  "fixed_window_roller",
  "size_trigger",
] }
shell-words = "1.1.0"
sha2 = "0.10.8"
subtle = "2.6.1"
unicode-width = "0.2.0"
async-recursion = "1.1.1"
http = "1.1.0"
indexmap = { version = "2.2.6", features = ["serde"] }
hmac = "0.12.1"
aws-smithy-eventstream = "0.60.4"
aws-smithy-types = "=1.4.9"
time = "=0.3.47"
urlencoding = "2.1.3"
json-patch = { version = "4.0.0", default-features = false }
bitflags = "2.5.0"
path-absolutize = "3.1.1"
hnsw_rs = "0.3.0"
uuid = { version = "1.9.1", features = ["v4"] }
scraper = { version = "0.23.1", default-features = false, features = [
  "deterministic",
] }
sys-locale = "0.3.1"
html_to_markdown = "0.1.0"
rust-embed = "8.5.0"
os_info = { version = "3.8.2", default-features = false }
bm25 = { version = "2.0.1", features = ["parallelism"] }
petgraph = { version = "0.7", features = ["serde-1"] }
which = "8.0.0"
fuzzy-matcher = "0.3.7"
terminal-colorsaurus = "0.4.8"
duct = "1.0.0"
argc = "1.23.0"
strum_macros = "0.27.2"
indoc = "2.0.6"
rmcp = { version = "3.1.2", features = [
  "client",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
  "reqwest-native-tls",
] }
num_cpus = "1.17.0"
tree-sitter = "0.26.8"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23"
colored = "3.0.0"
clap_complete = { version = "4.5.58", features = ["unstable-dynamic"] }
gman = "0.5.0"
clap_complete_nushell = "4.5.9"
open = "5"
rand = { version = "0.10.0", features = ["default"] }
url = "2.5.8"
self_update = { version = "0.44", default-features = false, features = [
  "reqwest",
  "rustls",
  "archive-tar",
  "compression-flate2",
  "archive-zip",
  "compression-zip-deflate",
] }
qrcode = "0.14"
tokio-util = "0.7"
arc-swap = "1.9.2"
# Pinned to the rand_core generation `reticulum-rs-transport` is built on: its announce
# builder takes a `CryptoRngCore` from this version and re-exports none, so `rand` 0.10's
# `OsRng` cannot be passed. Moves together with the transport pin below.
rand_core = { version = "0.6", features = ["getrandom"] }

# Reticulum transport and LXMF wire format, pinned to an exact revision because the
# published 0.11.0 is fourteen commits behind it and lacks the delivery-stamp calls
# re-exported at `lxmf_core::stamp` (`generate_stamp`, `validate_stamp`,
# `ticket_stamp`); it carries only the propagation-stamp half. Note that the pinned
# revision also calls itself 0.11.0, so retiring this pin needs a release strictly
# newer than that, carrying those calls, and both crates have to move together: they
# share `reticulum-rs-core`, and mixing a registry crate with a git one duplicates it.
# The git pin is development-only: it must be replaced by a crates.io version pin
# before merge, per the dependency policy in CONTRIBUTING.md.
#
# Both entries are unconditional on purpose: the mesh runtime in `src/mesh` is not
# feature-gated, so every CI leg compiles and tests it.
#
# Default features are kept deliberately too. `reticulum-rs-transport`'s default
# `storage` feature gates the SQLite-backed message and announce store that the
# store-and-forward work needs. The cost is that it pulls rusqlite with a bundled
# SQLite, whose C amalgamation is compiled on every platform. `bzip2-sys` comes in
# regardless of that feature and compiles a second, much smaller C library on Windows
# and anywhere pkg-config finds no system libbz2. Neither is a new prerequisite:
# `duckdb` above already requires a C toolchain everywhere.
#
# `lxmf-wire` (lib name `lxmf_core`) pulls `reticulum-rs-core` transitively, so that
# crate needs no entry of its own; `reticulum-rs-transport`'s lib name is
# `rns_transport`. The `reticulum-rs` umbrella is deliberately not used, for two
# independent reasons: it gates transport behind a feature and re-exports surface we do
# not use, and it covers only the `rns-*` crates and not `lxmf-wire`, so it cannot
# replace both entries anyway. Depending on the two directly keeps one mechanism
# instead of two.
reticulum-rs-transport = { git = "https://github.com/FreeTAKTeam/LXMF-rs", rev = "3ed5932da4420e2dd1b9d36283b0e72a364e3ebe" }
lxmf-wire = { git = "https://github.com/FreeTAKTeam/LXMF-rs", rev = "3ed5932da4420e2dd1b9d36283b0e72a364e3ebe" }
# Its `Value` appears in `rns_transport`'s `Link::request_payload` and
# `unpack_response_envelope` signatures, so it must stay semver-unified with the
# transport's own `rmpv`. Moves together with the transport pin above.
rmpv = "1.3"

[dependencies.reqwest]
version = "0.13.3"
features = ["json", "multipart", "stream", "form", "socks", "rustls"]
default-features = false

[dependencies.syntect]
version = "5.0.0"
default-features = false
features = ["parsing", "regex-onig", "plist-load"]

[target.'cfg(target_os = "macos")'.dependencies]
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.3.0", default-features = false, features = [
  "wayland-data-control",
] }

[target.'cfg(not(any(target_os = "linux", target_os = "android", target_os = "emscripten")))'.dependencies]
arboard = { version = "3.3.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Raw Win32 bindings for locking down the on-disk identity key. Each feature below is
# carried for one piece of that job. The call sites land with the identity-key work;
# the list is audited ahead of them and named here so it can be checked without
# guessing: `Win32_Security_Authorization` for
# `ConvertStringSecurityDescriptorToSecurityDescriptorW`, `Win32_Foundation` for the
# `LocalFree`/`HLOCAL` pair that releases the security descriptor it returns,
# `Win32_Security` for the `ACL` type, `Win32_Storage_FileSystem` for `CreateFileW`, and
# `Win32_System_Threading` for `OpenProcess` pid-liveness. No allocator feature is
# needed, `LocalFree` not being one of the `Local*` calls in `Win32_System_Memory`.
#
# The higher-level `windows` crate is not used: the surface here is a handful of FFI
# calls that need `unsafe` either way, so its wrapper types and COM machinery would cost
# compile time for little gain. `windows-acl` (last release 2021-01-11, winapi 0.3, Rust
# 2015 edition) and `windows-permissions` (last release 2021-06-29, winapi 0.3.9) are
# both dormant and would each drag a second Win32 binding stack in alongside this one.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[dev-dependencies]
ctor = "1.0.13"
pretty_assertions = "1.4.0"
rmcp = { version = "3.1.2", features = ["server"] }
serial_test = "3"
tokio = { version = "1.34.0", features = ["test-util"] }

[[bin]]
name = "coyote"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
opt-level = "z"
